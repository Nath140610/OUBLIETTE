<!DOCTYPE html>
<html lang=""fr">
<head>
  <meta charset=""UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>head>

<body>

  <h1>OUBLIETTE</h1>h1>
  <p class="sous-titre">Crée ton escape game. Enferme tes amis.</p>

  <div class="boutons">
    <button class=""bouton" onclick="allerCreer()">Créer un escape game</button>
    <button class="bouton" onclick="allerJouer()">Jouer</button>button>
  </div>div>

  <div class="boite-code">
    <p>Tu as un code de partie ?</p>p>
    <input type="text" id="champCode" maxlength="4" placeholder="0000">
    <br><br>
    <button class="bouton" onclick="verifierCode()">Entrer</button>button>
    <p class="message" id="message"></p>
  </div>div>

  <script>
    // code de test, plus tard ce sera different pour chaque partie
    var codeSecret = "1234";

    function allerCreer() {
      alert("L'éditeur n'existe pas encore. Bientôt !");
    }

    function allerJouer() {
      alert("La liste des escape games n'existe pas encore. Bientôt !");
    }

    function verifierCode() {
      // on recupere ce que le joueur a tape
      var codeTape = document.getElementById("champCode").value;
      var zoneMessage = document.getElementById("message");

      if (codeTape === "") {
        zoneMessage.textContent = "Entre un code d'abord.";
        zoneMessage.className = "message neutre";
      } else if (codeTape === codeSecret) {
        zoneMessage.textContent = "La porte s'ouvre...";
        zoneMessage.className = "message bon";
      } else {
        zoneMessage.textContent = "Mauvais code.";
        zoneMessage.className = "message faux";
      }
    }

    // pour valider avec la touche Entree
    document.getElementById("champCode").addEventListener("keydown", function(e) {
      if (e.key === "Enter") {
        verifierCode();
      }
    });
  </script>

</body>body>
